id = "refactor_rename"
category = "refactor"
setup = "fixtures/py_project"
timeout_seconds = 240
prompt = """
Rename the function `calc` to `compute` in this workspace. Update ALL
Python files, including call sites and imports. When you are done, run
`python -m pytest -q` and confirm the tests pass.
"""

[[checks]]
description = "No `def calc(` remains"
shell = "! grep -rq 'def calc(' src tests"

[[checks]]
description = "`def compute(` exists in src"
shell = "grep -rq 'def compute(' src"

[[checks]]
description = "compute works, calc is gone, the helper is kept or renamed consistently"
shell = '''{python} -c "import sys; sys.path.insert(0, 'src'); import mymath as m; assert m.compute(2, 3) == 5; assert not hasattr(m, 'calc'); h = getattr(m, 'double_calc', None) or getattr(m, 'double_compute'); assert h(4) == 8"'''

[[checks]]
description = "tests were updated, not deleted"
shell = "grep -qw 'compute' tests/test_mymath.py"

[[checks]]
description = "pytest passes"
shell = "{python} -m pytest -q"
