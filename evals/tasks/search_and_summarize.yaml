id: search_and_summarize
category: qa
setup: fixtures/small_repo
timeout_seconds: 180
prompt: |
  Find the SERVICE_NAME constant in this repository and write ONLY its
  string value (without quotes) to a file named `service.txt` in the
  workspace root.
checks:
  - shell: "test -f service.txt"
    description: "service.txt exists"
  - shell: "cat service.txt"
    description: "service.txt contains the service name"
    expect_stdout: "wonderland-widget"
